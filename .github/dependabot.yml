# Dependabot configuration for the org-default `.github` repo.
#
# This repo ships only Markdown + YAML community-health files. There
# is no Python, Node, Docker, or Go content, so the only ecosystem
# that meaningfully applies is `github-actions` (which will start
# producing PRs the moment a workflow is added under
# `.github/workflows/`).
#
# Keeping this file present even when there are no workflows yet is
# intentional — it satisfies the kit's `require_dependabot` (DP001)
# rule under `community_health_source: inherit` so consumer repos
# can point their kit `check` at the org default with no surprises.
#
# Reference:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
      time: "07:00"
      timezone: Etc/UTC
      prefix: "ci"
      - ci

# >>> managed-file-sync:dependabot_actions >>>
# Managed by Blackout Secure Managed File Sync — configure services in .github/bos-universal-config.json.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
# <<< managed-file-sync:dependabot_actions <<<

# >>> managed-file-sync:dependabot_pip >>>
# Managed by Blackout Secure Managed File Sync — configure services in .github/bos-universal-config.json.
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
      - python
# <<< managed-file-sync:dependabot_pip <<<
